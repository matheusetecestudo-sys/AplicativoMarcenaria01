<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RinoScore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    html {
      scroll-behavior: smooth;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }

    /* Custom Scrollbar for brutalist feel */
    ::-webkit-scrollbar {
      width: 12px;
      background: #000;
    }

    .dark ::-webkit-scrollbar {
      background: #000;
    }

    :not(.dark) ::-webkit-scrollbar {
      background: #f3f4f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #0000FF;
      border: 2px solid white;
    }

    :not(.dark) ::-webkit-scrollbar-thumb {
      border: 2px solid black;
    }

    /* ULTRA PREMIUM DESIGN SYSTEM */
    :root {
      --primary-glow: rgba(0, 0, 255, 0.4);
      --noise-opacity: 0.03;
    }

    .dark {
      --noise-opacity: 0.05;
    }

    /* Base Layer with Grain Texture */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: var(--noise-opacity);
      background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dark .glass {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .glow-blue {
      box-shadow: 0 0 30px var(--primary-glow);
    }

    .premium-card {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .premium-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    ::selection {
      background: #0000FF;
      color: #FFFFFF;
    }

    .dark ::selection {
      background: #FFFFFF;
      color: #0000FF;
    }

    /* REFINED ANIMATIONS */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .hover-glitch:hover {
      transform: translate(-4px, -4px);
      box-shadow: 6px 6px 0px 0px #0000FF;
    }

    .stagger-1 {
      animation-delay: 100ms;
    }

    .stagger-2 {
      animation-delay: 200ms;
    }

    .stagger-3 {
      animation-delay: 300ms;
    }

    .stagger-4 {
      animation-delay: 400ms;
    }

    /* GLOBAL BRUTALIST & MODERN UTILITIES */
    .brutal-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .brutal-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: 0.5s;
    }

    .brutal-btn:hover::after {
      left: 100%;
    }

    .brutal-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: none !important;
    }

    .brutal-input {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 4px;
    }

    .brutal-input:focus {
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    /* Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #0000FF;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0000FF",
            "alert": "#FF0000",
            "background-dark": "#000000",
            "background-light": "#F3F4F6",
            "panel-dark": "#1A1A1A",
            "panel-light": "#FFFFFF",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0",
            "lg": "0",
            "xl": "0",
            "full": "0",
          },
          borderWidth: {
            '3': '3px',
            '4': '4px',
          }
        },
      },
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.3?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-background-light dark:bg-background-dark font-display text-black dark:text-white overflow-hidden transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
